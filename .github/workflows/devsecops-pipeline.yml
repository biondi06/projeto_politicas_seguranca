name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # 1. Varredura de Segredos — detecta chaves (ex: APP_KEY),
  #    senhas de banco, tokens SMTP etc. expostos no histórico do Git.
  # ============================================================
  secrets-scan:
    name: Secrets Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # histórico completo, não só o último commit

      - name: Executar TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================
  # 2. Análise de Vulnerabilidades em Dependências (SCA) — checa
  #    se pacotes do composer.lock/package-lock.json têm CVEs
  #    conhecidas (ex: versão vulnerável do Laravel/Fortify).
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Executar Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'          # falha o job se achar HIGH/CRITICAL
          format: 'table'
          ignore-unfixed: true

  # ============================================================
  # 3. Análise Estática de Segurança (SAST) — procura padrões de
  #    código inseguro (ex: query sem binding, falha de validação).
  #    Repositório é público -> Semgrep open-source cobre bem o PHP.
  # ============================================================
  sast-scan:
    name: Static Application Security Testing (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Executar Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/php \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error
